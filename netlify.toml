[build]
  command = "vite build"
  publish = "dist"
  functions = "netlify/functions"

# Il frontend chiama /api/leads: instrada verso la function.
[[redirects]]
  from = "/api/leads"
  to = "/.netlify/functions/leads"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
